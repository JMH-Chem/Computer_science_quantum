name: scientific-validation
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Build local wheel with bundled browser assets
        run: uv run python scripts/package_release.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real browser workflows
        run: |
          uv run quantum-lab serve --data-dir /tmp/quantum-lab-ci > /tmp/quantum-lab-ci.log 2>&1 &
          qlab_server_pid=$!
          trap 'kill "$qlab_server_pid"' EXIT
          uv run python - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Server did not become healthy')
          PY
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
