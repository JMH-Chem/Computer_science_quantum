[project]
name = "quantum-lab"
version = "0.3.1"
description = "Local molecular and materials computation with transparent scientific learning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyscf==2.15.0", "numpy>=2.0,<3", "scipy>=1.14,<2",
  "ase>=3.26,<4", "geometric>=1.1,<2", "basis-set-exchange>=0.11,<1",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
quantum-lab = "quantum_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["science: real numerical engine validation", "periodic: periodic-system validation"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
